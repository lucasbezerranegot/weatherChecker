name: Kita Weather Checker

on:
  # Disparo manual de contingência. O agendamento roda localmente no Docker.
  workflow_dispatch:
    inputs:
      mode:
        description: 'Qual relatório executar?'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - night

jobs:
  run-weather-script:
    runs-on: ubuntu-latest
    
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4
        
      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Executar o Script Python
        env:
          PHONE_1: ${{ secrets.PHONE_1 }}
          APIKEY_1: ${{ secrets.APIKEY_1 }}
          PHONE_2: ${{ secrets.PHONE_2 }}
          APIKEY_2: ${{ secrets.APIKEY_2 }}
          PHONE_3: ${{ secrets.PHONE_3 }}
          APIKEY_3: ${{ secrets.APIKEY_3 }}
          HOUSEHOLDS_CONFIG_JSON: ${{ secrets.HOUSEHOLDS_CONFIG_JSON }}
        run: |
          python weatherChecker.py --mode "${{ github.event.inputs.mode }}"
