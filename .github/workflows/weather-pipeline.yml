name: Kita Weather Checker

on:
  # Disparo Manual (Aparece um botão com um Dropdown no GitHub)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Qual relatório executar?'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - night

  # Disparo Automático (Fuso Horário UTC!)
  schedule:
    # Foge do pico das 05:00. Roda às 04:53 UTC (06:53 em Munique)
    - cron: '53 4 * * *'
    # Foge do pico das 18:00. Roda às 17:53 UTC (19:53 em Munique)
    - cron: '53 17 * * *'

jobs:
  run-weather-script:
    runs-on: ubuntu-latest
    
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4
        
      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests tzdata
          
      - name: Definir o Modo de Execução (Automático vs Manual)
        id: set-mode
        # Se foi acionado manualmente, usa o input. Se foi automático às 18:30 UTC, é night. Senão, é morning.
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "MODE=${{ github.event.inputs.mode }}" >> $GITHUB_ENV
          elif [ "${{ github.event.schedule }}" == "30 18 * * *" ]; then
            echo "MODE=night" >> $GITHUB_ENV
          else
            echo "MODE=morning" >> $GITHUB_ENV
          fi
          
      - name: Executar o Script Python
        env:
          PHONE_1: ${{ secrets.PHONE_1 }}
          APIKEY_1: ${{ secrets.APIKEY_1 }}
          PHONE_2: ${{ secrets.PHONE_2 }}
          APIKEY_2: ${{ secrets.APIKEY_2 }}
        run: |
          python weatherChecker.py --mode $MODE
