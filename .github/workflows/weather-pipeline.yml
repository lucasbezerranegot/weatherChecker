name: Weather Checker

on:
  # Manual contingency run. The regular schedule runs locally in Docker.
  workflow_dispatch:
    inputs:
      mode:
        description: 'Which report should run?'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - night

jobs:
  run-weather-script:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run the weather report
        env:
          PHONE_1: ${{ secrets.PHONE_1 }}
          APIKEY_1: ${{ secrets.APIKEY_1 }}
          PHONE_2: ${{ secrets.PHONE_2 }}
          APIKEY_2: ${{ secrets.APIKEY_2 }}
          PHONE_3: ${{ secrets.PHONE_3 }}
          APIKEY_3: ${{ secrets.APIKEY_3 }}
          HOUSEHOLDS_CONFIG_JSON: ${{ secrets.HOUSEHOLDS_CONFIG_JSON }}
        run: |
          python weatherChecker.py --mode "${{ github.event.inputs.mode }}"
