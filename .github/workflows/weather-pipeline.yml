name: Kita Weather Checker

on:
  # Disparo Manual (para você testar quando quiser)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Qual relatório executar?'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - night

  # O Novo Gatilho Externo (Webhook)
  repository_dispatch:
    types: [morning_check, night_check]

jobs:
  run-weather-script:
    runs-on: ubuntu-latest
    
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4
        
      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Definir o Modo de Execução (Webhook vs Manual)
        id: set-mode
        # Lê a instrução enviada pelo cron-job.org ou pelo botão manual
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "MODE=${{ github.event.inputs.mode }}" >> $GITHUB_ENV
          elif [ "${{ github.event.action }}" == "night_check" ]; then
            echo "MODE=night" >> $GITHUB_ENV
          else
            echo "MODE=morning" >> $GITHUB_ENV
          fi
          
      - name: Executar o Script Python
        env:
          PHONE_1: ${{ secrets.PHONE_1 }}
          APIKEY_1: ${{ secrets.APIKEY_1 }}
          PHONE_2: ${{ secrets.PHONE_2 }}
          APIKEY_2: ${{ secrets.APIKEY_2 }}
          PHONE_3: ${{ secrets.PHONE_3 }}
          APIKEY_3: ${{ secrets.APIKEY_3 }}
          HOUSEHOLDS_CONFIG_JSON: ${{ secrets.HOUSEHOLDS_CONFIG_JSON }}
        run: |
          python weatherChecker.py --mode $MODE
