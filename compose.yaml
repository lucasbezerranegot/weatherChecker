services:
  weather-checker:
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    env_file:
      - path: .env
        required: false
    environment:
      HOUSEHOLDS_CONFIG_PATH: /run/config/households.json
      SCHEDULER_TIMEZONE: Europe/Berlin
      TZ: Europe/Berlin
    volumes:
      - ${HOUSEHOLDS_CONFIG_FILE:-./households.json}:/run/config/households.json:ro
    tmpfs:
      - /tmp:size=1m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-m", "weather_checker.healthcheck"]
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 10s
